<!DOCTYPE html>
<html>

<head>
    <title>Sign Up</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:15px;
            width:400px;
            box-shadow:0px 4px 15px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#1f4e79;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:1px solid #ccc;
            border-radius:8px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#1f4e79;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<form action="/signup" method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Sign Up
</button>
<p style="text-align:center;margin-top:15px;">
Already have an account?
<a href="/login-page">Login</a>
</p>

</form>

</div>

</body>

</html>
